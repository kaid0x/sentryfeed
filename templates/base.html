<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SentryFeed{% endblock %}</title>
<style nonce="{{ csp_nonce }}">
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #12151a;
    --panel-hover: #181c22;
    --line: #232830;
    --text: #e4e7eb;
    --muted: #8a929c;
    --red: #f0524f;
    --orange: #f5903d;
    --yellow: #e5c243;
    --green: #4cc38a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 var(--sans);
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 20px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .brand { font: 600 17px var(--mono); letter-spacing: 0.04em; text-decoration: none; }
  .brand span { color: var(--red); }
  .sections { display: flex; gap: 16px; }
  .sections a {
    font-size: 13.5px;
    color: var(--muted);
    text-decoration: none;
    padding-bottom: 2px;
    border-bottom: 2px solid transparent;
  }
  .sections a:hover { color: var(--text); }
  .sections a[aria-current="page"] { color: var(--text); border-bottom-color: var(--red); }

  .sev-red    { --sev: var(--red); }
  .sev-orange { --sev: var(--orange); }
  .sev-yellow { --sev: var(--yellow); }
  .sev-green  { --sev: var(--green); }

  @media (max-width: 860px) {
    header { padding: 12px 16px; }
    body { height: auto; }
  }
</style>
{% block styles %}{% endblock %}
</head>
<body>

<header>
  <a class="brand" href="/">SENTRY<span>/</span>FEED</a>
  <nav class="sections" aria-label="Sections">
    <a href="/"{% if active == "feed" %} aria-current="page"{% endif %}>Feed</a>
    <a href="/password"{% if active == "password" %} aria-current="page"{% endif %}>Password check</a>
    <a href="/scan"{% if active == "scan" %} aria-current="page"{% endif %}>File &amp; link check</a>
  </nav>
  {% block header_extra %}{% endblock %}
</header>

{% block body %}{% endblock %}

{% block scripts %}{% endblock %}
</body>
</html>

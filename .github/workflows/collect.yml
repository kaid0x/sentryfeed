name: Collect

# The collector, writing to the Turso database: the job the Pi's systemd timer does for its
# own SQLite file. Run it by hand from the Actions tab (the 30-minute schedule is added once a
# manual run has been checked). Settings come from the repository's Actions secrets; secret
# values are masked in the logs, which are public on a public repository.
on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: a slow run finishes before the next one starts.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to commits, not tags: a tag can later be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          RANSOMWARE_LIVE_KEY: ${{ secrets.RANSOMWARE_LIVE_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: |
          # Without Turso the collector would fill a throwaway file on this machine, using up
          # API calls for nothing.
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::Add the TURSO_DATABASE_URL and TURSO_AUTH_TOKEN secrets first"
            exit 1
          fi
          python collect.py

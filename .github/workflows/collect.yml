name: Collect

# The collector, writing to the Turso database: the job the Pi's systemd timer does for its
# own SQLite file. Settings come from the repository's Actions secrets; secret values are
# masked in the logs, which are public on a public repository.
on:
  # Every 30 minutes, at :13 and :43 UTC: GitHub delays (and at busy times drops) scheduled
  # runs, most of all at the start of the hour. GitHub turns schedules off after 60 days
  # without activity in the repository; re-enable it from the Actions tab if that happens.
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:      # the Run workflow button

permissions:
  contents: read

# One run at a time: a slow run finishes before the next one starts.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    # A fixed release rather than ubuntu-latest, so an operating system upgrade is our choice.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pinned to commits, not tags: a tag can later be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          RANSOMWARE_LIVE_KEY: ${{ secrets.RANSOMWARE_LIVE_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: |
          # Without Turso the collector would fill a throwaway file on this machine, using up
          # API calls for nothing.
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::Add the TURSO_DATABASE_URL and TURSO_AUTH_TOKEN secrets first"
            exit 1
          fi
          python collect.py
